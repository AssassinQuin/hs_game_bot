# hsbot 配置 —— 配置项在此集中管理(CLI 仅有 --config 与 replay/import-all 子命令)
deck_name: 奇迹德

# 直接指定卡组代码(设置后优先于 Decks.log 匹配; 注释掉则按 deck_name 匹配 Decks.log)
# deck_code: AAEBAfHGBwL9jQaluwYO/gHTA4/2AuC+A/DUA7ClBK7ABNXSBIHUBIDKBpD0BpX0BqqvB4LaBwAA

# 本机战网名 —— 友方判定首选依据(hslog 启发式会翻转, 见 docs/M1_MONITOR.md §1)
battletag: 湫然#51704

# Hearthstone Logs 根目录(会话目录 Hearthstone_* 的父目录)
# 留空则按平台自动探测: Windows 常见安装位 / macOS Library / Linux Proton/Wine 前缀
logs_dir: E:\battle\Hearthstone\Logs

data_dir: data
poll_interval: 0.5        # 日志轮询间隔(秒)
session_check_interval: 10  # 新会话目录检查间隔(秒)
# draw_dedup_seconds: 0.5 # 同一实体抽牌多重揭示路径的去重窗口(秒)

# ── 输出 ──
console_echo: true        # 悬浮窗之外是否同步打印到控制台
overlay_enabled: true     # 半透明置顶日志窗(炉石需用"无边框/窗口化"显示模式)
overlay_alpha: 0.72
overlay_geometry: 460x780+8+120   # 默认宽x高+左边距+上边距; 实际位置/大小自动
                                  # 记忆到 data/overlay_state.json 并优先生效
overlay_font_size: 10
overlay_topmost: true     # 窗口置顶: 只应真实运行开启。测试/回放一律不置顶、
                          # 不弹窗(只走日志/控制台), 不抢机器前台
overlay_borderless: false # true=无边框(不可拖动/关闭, 需改配置还原)
mulligan_advice: true     # 留牌环节高亮建议: 留X换Y(依据对手+留/换胜率, 模型来自
                          # python -m trainer mulligan; 无模型时只显示"起手可留")
# 信息分色(按人物与事件类型; 需自定义时取消注释整块并改色值):
# overlay_colors:
#   my: "#b8e6a0"         # 我方动作
#   opp: "#ffa477"        # 对面动作
#   unknown: "#9aa4ad"    # 未知方([T·?])
#   header: "#7ec8ff"     # 回合标题
#   snapshot: "#ffd479"   # 快照
#   game_end: "#7ec8ff"   # 终局
#   notice: "#8fb7d4"     # 系统通知(新对局/监控会话)
#   error: "#ff6b6b"      # 错误
#   advice: "#ffd700"     # 留牌建议(开局高亮)

# ── 训练语料 ──
training_dir: data/training
auto_training: true       # 每局结束自动导出训练样本(也可 import-all 子命令批量回填)
