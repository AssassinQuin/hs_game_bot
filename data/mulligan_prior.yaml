# 留牌专家先验 —— 人工维护(入库), 训练器 train/report/advise 自动读取。
#
# 作用: 无数据兜底 + 有数据时的收缩目标。自己攒的对局越多, 先验话语权越小
# (gain = w×数据对比 + (1-w)×先验, w = n/(n+4))。
#
# 语法(卡名或 card_id 均可; 卡名需与卡表 cards.zh.json 一致):
#   <卡组名>:
#     engine: [卡名, ...]            # 引擎卡(预留: 近似手牌配对的相似度加权)
#     cards:
#       <卡名>: {keep: 增益, keep_coin: 后手覆盖, keep_first: 先手覆盖, note: 备注}
#     pairs:
#       - {cards: [卡名A, 卡名B], bonus: 协同增益}
#         # 两张同时留的加成, 计入集合枚举总分
#     keep = 留牌增益先验(留→胜率 − 换→胜率 的先验估计, 0.03 ≈ +3%)
#
# ⚠ 下面 奇迹德 一节是 AI 按牌型常识填的初始草稿(2026-09-13), 数值纯属
#   起点, 请按实际手感修改; 删掉整节 = 回到纯数据驱动。
奇迹德:
  engine: [黑市拍卖师]
  cards:
    黑市拍卖师: {keep: 0.20, note: 引擎, 留它才有奇迹循环}
    顺水漂流: {keep: 0.08, note: 1费过牌, 喂拍卖师}
    水栖形态: {keep: 0.06, note: 0费法术, 喂拍卖师}
    月火术: {keep: 0.04, note: 0费法术, 喂拍卖师}
    激活: {keep: 0.02, keep_coin: 0.06, note: 后手币激活节奏强}
    雷霆绽放: {keep: 0.04, note: 0费成长}
    生物计划: {keep: 0.03, note: 成长/过牌}
    建造水晶塔: {keep: 0.04, note: 0费法术}
    活体根须: {keep: 0.03, note: 1费灵活}
  pairs:
    - {cards: [黑市拍卖师, 顺水漂流], bonus: 0.10}
    - {cards: [黑市拍卖师, 月火术], bonus: 0.08}
    - {cards: [黑市拍卖师, 水栖形态], bonus: 0.08}
